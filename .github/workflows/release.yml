name: Release

# 推送 vX.Y.Z（稳定版）或 vX.Y.Z-beta.N（测试版）标签时构建安装包并上传到 GitHub Releases 草稿
# 流程与检查清单见 docs/design/release.md
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Windows 为主平台；macOS / Linux 为次要平台（未签名），三个平台的安装包上传到同一个 Release 草稿
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
          - os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Check tag matches package.json version
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != package.json v$v"; exit 1; }
      - run: pnpm build
      - name: Build and publish installer
        run: pnpm exec electron-builder ${{ matrix.target }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS 未签名：不自动查找钥匙串中的证书（使用 ad-hoc 签名）
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ matrix.os == 'macos-latest' && 'false' || 'true' }}
          # 取得代码签名证书后在仓库 Secrets 中配置（NFR-SEC-05）
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
